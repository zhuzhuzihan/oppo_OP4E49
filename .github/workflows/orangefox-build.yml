name: OrangeFox Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
      BUILD_TARGET:
        description: 'Build target partition'
        required: true
        default: 'recovery'
        type: choice
        options:
          - 'recovery'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'master'
      GH_RELEASE:
        description: 'Upload to GitHub Release'
        required: true
        default: true
        type: boolean
jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/Boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          docker image prune -af
          df -h

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: OrangeFox Build
        uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
        with:
          USER_NAME: ${{ github.actor }}
          USER_EMAIL: ${{ github.actor }}@users.noreply.github.com
          DEVICE_TREE: ${{ github.server_url }}/${{ github.repository }}
          DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          DEVICE_PATH: 'device/oppo/OP4E49'
          DEVICE_NAME: 'OP4E49'
          BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
          GH_RELEASE: ${{ github.event.inputs.GH_RELEASE }}
          MAINTAINER_URL: ''

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OP4E49-${{ github.run_id }}
          path: |
            /home/runner/work/_actions/UWU-TEAM/UWU-OrangeFox-Builder/v1.0.0/OrangeFox/fox_12.1/out/target/product/OP4E49/OrangeFox-*.img
            /home/runner/work/_actions/UWU-TEAM/UWU-OrangeFox-Builder/v1.0.0/OrangeFox/fox_12.1/out/target/product/OP4E49/OrangeFox-*.img.md5
            /home/runner/work/_actions/UWU-TEAM/UWU-OrangeFox-Builder/v1.0.0/OrangeFox/fox_12.1/out/target/product/OP4E49/OrangeFox-*.zip
            /home/runner/work/_actions/UWU-TEAM/UWU-OrangeFox-Builder/v1.0.0/OrangeFox/fox_12.1/out/target/product/OP4E49/OrangeFox-*.zip.md5
          if-no-files-found: warn
          retention-days: 7
